# Render Blueprint: https://render.com/docs/blueprint-spec
#
#   holdfast         public relay + website, SQLite on a 1 GB persistent disk
#   holdfast-ollama  private Ollama server with gemma3:4b baked into the image (2 CPU / 4 GB)
#
# Both must be in the same region to reach each other privately.
# gemma3:4b, not 1b: on 1b the diagnoses were wrong or vague often enough that the built-in rules
# replaced most of them (design.md §5). The 4b model needs about 3.5 GB loaded, so 2c-4g is the
# smallest plan that fits. Scale it down or suspend it after judging to save credit.
services:
  - type: web
    name: holdfast
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: holdfast-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HF_DB
        value: /var/data/holdfast.db
      - key: HF_MODEL
        value: gemma3:4b
      # A 4b answer on 2 CPUs can take a minute or two. The page shows the rules' answer meanwhile.
      - key: HF_MODEL_TIMEOUT
        value: 240s
      # One thread per CPU of the Ollama service.
      - key: HF_MODEL_THREADS
        value: "2"
      - key: HF_TIMEZONE
        value: Asia/Kolkata
      - key: HF_ADMIN_TOKEN
        generateValue: true
      # JSON list of fixed routes for the admin, set in the dashboard so secrets never enter the repo.
      - key: HF_ROUTES
        sync: false
      # Live mode. Signs the sign-in cookie and encrypts stored GitHub tokens and webhook secrets.
      - key: HF_SESSION_KEY
        generateValue: true
      # From the GitHub OAuth app (github.com/settings/developers). Callback URL:
      # https://<this service>.onrender.com/auth/github/callback. Leave empty to keep Live sign-in off.
      - key: HF_GITHUB_CLIENT_ID
        sync: false
      - key: HF_GITHUB_CLIENT_SECRET
        sync: false
      - key: HF_OLLAMA_URL
        fromService:
          type: pserv
          name: holdfast-ollama
          property: hostport

  - type: pserv
    name: holdfast-ollama
    runtime: docker
    region: singapore
    plan: 2c-4g
    dockerfilePath: ./ollama/Dockerfile
    dockerContext: ./ollama
